name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: forgejo.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: go vet ./...
      - run: staticcheck ./...

  test:
    if: forgejo.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run tests with coverage
        run: |
          set -euo pipefail
          mkdir -p "${TMPDIR:-/tmp}/${{ forgejo.repository_owner }}"
          COVDIR=$(mktemp -d "${TMPDIR:-/tmp}/${{ forgejo.repository_owner }}/$(basename "${{ forgejo.repository }}")-XXXXXX")
          trap 'rm -rf -- "$COVDIR"' EXIT
          go mod download
          mkdir -p "$COVDIR/data"
          go test -cover ./... -args -test.gocoverdir="$COVDIR/data"
          go tool covdata textfmt -i="$COVDIR/data" -o="$COVDIR/coverage.out"
          COVERAGE=$(go tool cover -func="$COVDIR/coverage.out" | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "Aggregate coverage: $COVERAGE%"
          awk -v coverage="$COVERAGE" 'BEGIN { exit !(coverage >= 60) }' || {
            echo "::error::coverage $COVERAGE% < threshold 60%" >&2
            exit 1
          }

  build:
    if: forgejo.event_name != 'schedule'
    needs: [lint, test]
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set build info
        run: |
          VERSION="${FORGEJO_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$FORGEJO_ENV"
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> "$FORGEJO_ENV"
          BUILD_EPOCH=$(date -u +%s)
          echo "BUILD_EPOCH=$BUILD_EPOCH" >> "$FORGEJO_ENV"
      - name: Build server and CLI
        run: |
          mkdir -p artifacts
          LDFLAGS="-s -w -X 'main.Version=${{ env.VERSION }}' -X 'main.CommitID=${{ env.COMMIT_ID }}' -X 'main.BuildEpoch=${{ env.BUILD_EPOCH }}'"
          go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o artifacts/casspeed ./src
          go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o artifacts/casspeed-cli ./src/client
      - name: Stage build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-build-output
          path: artifacts/
          retention-days: 1

  upload-artifacts:
    if: forgejo.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ci-build-output
          path: artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: casspeed-ci-${{ forgejo.sha }}
          path: artifacts/
          retention-days: 7

  license-scan:
    if: forgejo.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Reject copyleft dependencies
        run: |
          if go-licenses csv ./... | grep -iE 'GPL|AGPL|LGPL'; then
            echo "ERROR: Copyleft license detected!" >&2
            exit 1
          fi

  vuln-scan:
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - if: forgejo.event_name == 'schedule' || hashFiles('go.sum') != ''
        run: govulncheck ./...

  secret-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Pick the scan scope
        id: scope
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ "${{ forgejo.event_name }}" = "pull_request" ]; then
            echo "base=${{ forgejo.event.pull_request.base.sha }}" >> "$FORGEJO_OUTPUT"
            echo "head=${{ forgejo.event.pull_request.head.sha }}" >> "$FORGEJO_OUTPUT"
            echo "results=verified,unknown" >> "$FORGEJO_OUTPUT"
          elif [ "${{ forgejo.event_name }}" = "push" ] && [ "${{ forgejo.event.before }}" != "$ZERO" ]; then
            echo "base=${{ forgejo.event.before }}" >> "$FORGEJO_OUTPUT"
            echo "head=${{ forgejo.event.after }}" >> "$FORGEJO_OUTPUT"
            echo "results=verified,unknown" >> "$FORGEJO_OUTPUT"
          else
            echo "results=verified" >> "$FORGEJO_OUTPUT"
          fi
      - uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71  # v3.100.1
        with:
          base: ${{ steps.scope.outputs.base }}
          head: ${{ steps.scope.outputs.head }}
          extra_args: --results=${{ steps.scope.outputs.results }} --exclude-paths=.github/trufflehog-exclude.txt

  workflow-policy:
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Require SHA-pinned actions and reject pull_request_target
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r line; do
            ref=$(printf '%s' "$line" | sed -E 's/.*uses:[[:space:]]*([^[:space:]#]+).*/\1/')
            case "$ref" in
              ./*) continue ;;
              */*@*)
                sha=${ref#*@}
                if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$' || ! printf '%s' "$line" | grep -qE '#[[:space:]]+v[0-9]'; then
                  echo "::error::UNPINNED: $line"
                  fail=1
                fi
                ;;
              *)
                echo "::error::INVALID ACTION REFERENCE: $line"
                fail=1
                ;;
            esac
          done < <(grep -rhnE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows/ .gitea/workflows/ .forgejo/workflows/ 2>/dev/null || true)
          if grep -RqnE '^[[:space:]]*pull_request_target:' .github/workflows/ .gitea/workflows/ .forgejo/workflows/; then
            echo '::error::pull_request_target is forbidden for untrusted workflows'
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo 'OK: third-party actions are SHA-pinned and pull_request_target is absent'

  image-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build image for scanning
        run: docker build --build-arg VERSION=ci --tag casspeed:ci -f docker/Dockerfile .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: casspeed:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
