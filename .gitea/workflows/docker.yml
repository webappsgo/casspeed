name: Docker Build

on:
  push:
    # ALL branches
    branches: ['**']
    tags:
      - 'v*'
      - '*.*.*'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: docker-${{ gitea.ref }}-${{ gitea.event_name }}
  cancel-in-progress: ${{ gitea.ref == 'refs/heads/main' || gitea.ref == 'refs/heads/master' || gitea.ref == 'refs/heads/beta' }}

env:
  PROJECT_NAME: casspeed
  REGISTRY: ${{ gitea.server_url }}

jobs:
  build-standard:
    runs-on: ubuntu-26.04
    if: gitea.event_name != 'schedule'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Set build info
        run: |
          # ghcr.io requires a lowercase image path
          echo "IMAGE_NAME=$(echo "${{ gitea.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITEA_ENV
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> $GITEA_ENV
          # OFFICIAL_SITE (optional): site.txt wins; otherwise use repository secrets or leave empty
          if [ -f site.txt ]; then
            echo "OFFICIAL_SITE=$(cat site.txt)" >> $GITEA_ENV
          else
            echo "OFFICIAL_SITE=${{ secrets.OFFICIAL_SITE }}" >> $GITEA_ENV
          fi
          echo "YYMM=$(date +"%y%m")" >> $GITEA_ENV
          if [[ "${{ gitea.ref }}" == refs/tags/* ]]; then
            VERSION="${GITEA_REF#refs/tags/}"
            echo "VERSION=${VERSION#v}" >> $GITEA_ENV
            echo "IS_TAG=true" >> $GITEA_ENV
          else
            echo "VERSION=$(git rev-parse --short=7 HEAD)" >> $GITEA_ENV
            echo "IS_TAG=false" >> $GITEA_ENV
          fi
          BUILD_EPOCH=$(date -u +%s)
          echo "BUILD_EPOCH=$BUILD_EPOCH" >> $GITEA_ENV
          echo "BUILD_DATE=$(date -u -d @$BUILD_EPOCH +"%Y-%m-%dT%H:%M:%SZ")" >> $GITEA_ENV

      - name: Determine tags (standard)
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_ID }}"

          if [[ "${{ env.IS_TAG }}" == "true" ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.YYMM }}"
          else
            if [[ "${{ gitea.ref }}" == refs/heads/beta ]]; then
              TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:beta"
            fi
          fi

          echo "tags=$TAGS" >> $GITEA_OUTPUT

      - name: Docker metadata (standard)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.COMMIT_ID }}
          labels: |
            maintainer=casapps
            org.opencontainers.image.vendor=casapps
            org.opencontainers.image.authors=casapps
            org.opencontainers.image.title=${{ env.PROJECT_NAME }}
            org.opencontainers.image.base.name=${{ env.PROJECT_NAME }}
            org.opencontainers.image.description=${{ env.PROJECT_NAME }} - standard image (alpine)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.schema-version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            org.opencontainers.image.url=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.documentation=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.vcs-type=Git
            com.gitea.containers.toolbox=false
          annotations: |
            org.opencontainers.image.vendor=casapps
            org.opencontainers.image.authors=casapps
            maintainer=casapps
            org.opencontainers.image.title=${{ env.PROJECT_NAME }}
            org.opencontainers.image.base.name=${{ env.PROJECT_NAME }}
            org.opencontainers.image.description=${{ env.PROJECT_NAME }} - standard image (alpine)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.schema-version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            org.opencontainers.image.url=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.documentation=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.vcs-type=Git
            com.gitea.containers.toolbox=false

      - name: Build and push (standard)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_EPOCH=${{ env.BUILD_EPOCH }}
            COMMIT_ID=${{ env.COMMIT_ID }}
            OFFICIAL_SITE=${{ env.OFFICIAL_SITE }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Verify standard image contract
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_ID }}
          REQUIRE_OVERLAY: ${{ vars.REQUIRE_OVERLAY || '0' }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -c 'for c in bash curl tor i2pd tini; do command -v "$c" || exit 1; done'
          mkdir -p "${TMPDIR:-/tmp}/casapps"
          TEST_DIR=$(mktemp -d "${TMPDIR:-/tmp}/casapps/casspeed-XXXXXX")
          chmod 700 "$TEST_DIR"
          mkdir -p "$TEST_DIR/config" "$TEST_DIR/data"
          CONTAINER_NAME="casspeed-contract-${GITEA_RUN_ID}"
          cleanup() {
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            rm -rf -- "$TEST_DIR"
          }
          trap cleanup EXIT INT TERM
          docker run -d --name "$CONTAINER_NAME" -p 127.0.0.1::80 \
            -e LISTEN=0.0.0.0 -e PORT=80 \
            -v "$TEST_DIR/config:/config" -v "$TEST_DIR/data:/data" "$IMAGE"
          PORT=$(docker port "$CONTAINER_NAME" 80/tcp | sed -E 's|.*:||')
          STATE=
          for attempt in $(seq 1 180); do
            if ! docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME" | grep -qx true; then
              docker logs "$CONTAINER_NAME"
              exit 1
            fi
            BODY=$(curl -q -fsS --max-time 3 -H 'Accept: application/json' "http://127.0.0.1:${PORT}/server/healthz" 2>/dev/null || true)
            STATE=$(printf '%s' "$BODY" | sed -n 's/.*"tor":{[^}]*"status":"\([^"]*\)".*/\1/p')
            case "$STATE" in
              healthy) break ;;
              error) docker logs "$CONTAINER_NAME"; exit 1 ;;
              starting|unavailable|'') sleep 1 ;;
              *) docker logs "$CONTAINER_NAME"; exit 1 ;;
            esac
          done
          if [ "$STATE" != healthy ]; then
            if [ "$REQUIRE_OVERLAY" = 1 ]; then
              docker logs "$CONTAINER_NAME"
              echo "ERROR: Tor did not become healthy within 180 seconds" >&2
              exit 1
            fi
            if curl -q -fsS --connect-timeout 5 --max-time 8 https://example.com/ >/dev/null 2>&1; then
              docker logs "$CONTAINER_NAME"
              echo "ERROR: outbound network is available but Tor did not become healthy (status: ${STATE:-unknown})" >&2
              exit 1
            fi
            case "$STATE" in
              starting|unavailable) echo "SKIP: no outbound network" >&2 ;;
              *) docker logs "$CONTAINER_NAME"; echo "ERROR: no valid Tor status from /server/healthz" >&2; exit 1 ;;
            esac
          fi

  build-devel:
    runs-on: ubuntu-26.04
    if: (gitea.event_name == 'schedule' || gitea.event_name == 'workflow_dispatch' || gitea.event_name == 'push') && (gitea.ref == 'refs/heads/main' || gitea.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Set build info
        run: |
          # ghcr.io requires a lowercase image path
          echo "IMAGE_NAME=$(echo "${{ gitea.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITEA_ENV
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> $GITEA_ENV
          # OFFICIAL_SITE (optional): site.txt wins; otherwise use repository secrets or leave empty
          if [ -f site.txt ]; then
            echo "OFFICIAL_SITE=$(cat site.txt)" >> $GITEA_ENV
          else
            echo "OFFICIAL_SITE=${{ secrets.OFFICIAL_SITE }}" >> $GITEA_ENV
          fi
          BUILD_EPOCH=$(date -u +%s)
          echo "BUILD_EPOCH=$BUILD_EPOCH" >> $GITEA_ENV
          echo "BUILD_DATE=$(date -u -d @$BUILD_EPOCH +"%Y-%m-%dT%H:%M:%SZ")" >> $GITEA_ENV

      - name: Docker metadata (devel)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=devel
          labels: |
            maintainer=casapps
            org.opencontainers.image.vendor=casapps
            org.opencontainers.image.authors=casapps
            org.opencontainers.image.title=${{ env.PROJECT_NAME }}-devel
            org.opencontainers.image.base.name=${{ env.PROJECT_NAME }}
            org.opencontainers.image.description=${{ env.PROJECT_NAME }} - development image (alpine, debug mode)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.version=${{ env.COMMIT_ID }}
            org.opencontainers.image.schema-version=${{ env.COMMIT_ID }}
            org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            org.opencontainers.image.url=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.documentation=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.vcs-type=Git
            com.gitea.containers.toolbox=false
          annotations: |
            org.opencontainers.image.vendor=casapps
            org.opencontainers.image.authors=casapps
            maintainer=casapps
            org.opencontainers.image.title=${{ env.PROJECT_NAME }}-devel
            org.opencontainers.image.base.name=${{ env.PROJECT_NAME }}
            org.opencontainers.image.description=${{ env.PROJECT_NAME }} - development image (alpine, debug mode)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.version=${{ env.COMMIT_ID }}
            org.opencontainers.image.schema-version=${{ env.COMMIT_ID }}
            org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            org.opencontainers.image.url=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.documentation=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.vcs-type=Git
            com.gitea.containers.toolbox=false

      - name: Build and push (devel)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:devel
          build-args: |
            VERSION=${{ env.COMMIT_ID }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_EPOCH=${{ env.BUILD_EPOCH }}
            COMMIT_ID=${{ env.COMMIT_ID }}
            OFFICIAL_SITE=${{ env.OFFICIAL_SITE }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Verify devel image contract
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:devel
          REQUIRE_OVERLAY: ${{ vars.REQUIRE_OVERLAY || '0' }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -c 'for c in bash curl tor i2pd tini; do command -v "$c" || exit 1; done'
          mkdir -p "${TMPDIR:-/tmp}/casapps"
          TEST_DIR=$(mktemp -d "${TMPDIR:-/tmp}/casapps/casspeed-XXXXXX")
          chmod 700 "$TEST_DIR"
          mkdir -p "$TEST_DIR/config" "$TEST_DIR/data"
          CONTAINER_NAME="casspeed-contract-devel-${GITEA_RUN_ID}"
          cleanup() {
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            rm -rf -- "$TEST_DIR"
          }
          trap cleanup EXIT INT TERM
          docker run -d --name "$CONTAINER_NAME" -p 127.0.0.1::80 \
            -e LISTEN=0.0.0.0 -e PORT=80 \
            -v "$TEST_DIR/config:/config" -v "$TEST_DIR/data:/data" "$IMAGE"
          PORT=$(docker port "$CONTAINER_NAME" 80/tcp | sed -E 's|.*:||')
          STATE=
          for attempt in $(seq 1 180); do
            if ! docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME" | grep -qx true; then
              docker logs "$CONTAINER_NAME"
              exit 1
            fi
            BODY=$(curl -q -fsS --max-time 3 -H 'Accept: application/json' "http://127.0.0.1:${PORT}/server/healthz" 2>/dev/null || true)
            STATE=$(printf '%s' "$BODY" | sed -n 's/.*"tor":{[^}]*"status":"\([^"]*\)".*/\1/p')
            case "$STATE" in
              healthy) break ;;
              error) docker logs "$CONTAINER_NAME"; exit 1 ;;
              starting|unavailable|'') sleep 1 ;;
              *) docker logs "$CONTAINER_NAME"; exit 1 ;;
            esac
          done
          if [ "$STATE" != healthy ]; then
            if [ "$REQUIRE_OVERLAY" = 1 ]; then
              docker logs "$CONTAINER_NAME"
              echo "ERROR: Tor did not become healthy within 180 seconds" >&2
              exit 1
            fi
            if curl -q -fsS --connect-timeout 5 --max-time 8 https://example.com/ >/dev/null 2>&1; then
              docker logs "$CONTAINER_NAME"
              echo "ERROR: outbound network is available but Tor did not become healthy (status: ${STATE:-unknown})" >&2
              exit 1
            fi
            case "$STATE" in
              starting|unavailable) echo "SKIP: no outbound network" >&2 ;;
              *) docker logs "$CONTAINER_NAME"; echo "ERROR: no valid Tor status from /server/healthz" >&2; exit 1 ;;
            esac
          fi
