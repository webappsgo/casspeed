name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: gitea.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: go vet ./...
      - run: staticcheck ./...

  test:
    if: gitea.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run tests with coverage
        id: run-tests
        run: |
          mkdir -p "/tmp/${{ gitea.repository_owner }}"
          COVDIR=$(mktemp -d "/tmp/${{ gitea.repository_owner }}/$(basename "${{ gitea.repository }}")-XXXXXX")
          echo "COVDIR=$COVDIR" >> "$GITEA_ENV"
          echo "covdir=$COVDIR" >> "$GITEA_OUTPUT"
          go test -cover -coverprofile="$COVDIR/coverage.out" ./...
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-data
          path: ${{ steps.run-tests.outputs.covdir }}/coverage.out
          retention-days: 1

  build:
    if: gitea.event_name != 'schedule'
    needs: [lint, test]
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set build info
        run: |
          VERSION="${GITEA_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITEA_ENV"
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> "$GITEA_ENV"
          BUILD_EPOCH=$(date -u +%s)
          echo "BUILD_EPOCH=$BUILD_EPOCH" >> "$GITEA_ENV"
      - name: Build server and CLI
        run: |
          mkdir -p artifacts
          LDFLAGS="-s -w -X 'main.Version=${{ env.VERSION }}' -X 'main.CommitID=${{ env.COMMIT_ID }}' -X 'main.BuildEpoch=${{ env.BUILD_EPOCH }}'"
          go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o artifacts/casspeed ./src
          go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o artifacts/casspeed-cli ./src/client
      - name: Stage build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-build-output
          path: artifacts/
          retention-days: 1

  coverage:
    if: gitea.event_name != 'schedule'
    needs: test
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage-data
          path: coverage
      - name: Enforce coverage threshold
        run: |
          THRESHOLD=60
          PCT=$(go tool cover -func=coverage/coverage.out | awk '/^total:/ {gsub("%","",$3); print int($3)}')
          if [ "$PCT" -lt "$THRESHOLD" ]; then
            echo "::error::coverage $PCT% < threshold $THRESHOLD%"
            exit 1
          fi

  upload-artifacts:
    if: gitea.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ci-build-output
          path: artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: casspeed-ci-${{ gitea.sha }}
          path: artifacts/
          retention-days: 7

  license-scan:
    if: gitea.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Reject copyleft dependencies
        run: |
          if go-licenses csv ./... | grep -iE 'GPL|AGPL|LGPL'; then
            echo "ERROR: Copyleft license detected!" >&2
            exit 1
          fi

  vuln-scan:
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - if: gitea.event_name == 'schedule' || hashFiles('go.sum') != ''
        run: govulncheck ./...

  secret-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Pick the scan scope
        id: scope
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ "${{ gitea.event_name }}" = "pull_request" ]; then
            echo "base=${{ gitea.event.pull_request.base.sha }}" >> "$GITEA_OUTPUT"
            echo "head=${{ gitea.event.pull_request.head.sha }}" >> "$GITEA_OUTPUT"
            echo "results=verified,unknown" >> "$GITEA_OUTPUT"
          elif [ "${{ gitea.event_name }}" = "push" ] && [ "${{ gitea.event.before }}" != "$ZERO" ]; then
            echo "base=${{ gitea.event.before }}" >> "$GITEA_OUTPUT"
            echo "head=${{ gitea.event.after }}" >> "$GITEA_OUTPUT"
            echo "results=verified,unknown" >> "$GITEA_OUTPUT"
          else
            echo "results=verified" >> "$GITEA_OUTPUT"
          fi
      - uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71  # v3.100.1
        with:
          base: ${{ steps.scope.outputs.base }}
          head: ${{ steps.scope.outputs.head }}
          extra_args: --results=${{ steps.scope.outputs.results }} --exclude-paths=.github/trufflehog-exclude.txt

  workflow-policy:
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Require SHA-pinned actions
        run: |
          awk '
            /^[[:space:]]*uses:/ {
              action = $0
              sub(/^[[:space:]]*uses:[[:space:]]*/, "", action)
              split(action, parts, "@")
              version = parts[2]
              sub(/[[:space:]].*$/, "", version)
              if (length(version) != 40 || version !~ /^[0-9a-f]+$/ || action !~ /#[[:space:]]+v[0-9]/) {
                print FILENAME ":" FNR ": action is not SHA-pinned with a version comment: " $0
                failed = 1
              }
            }
            END { exit failed }
          ' .github/workflows/*.yml .gitea/workflows/*.yml .gitea/workflows/*.yml .forgejo/workflows/*.yml

  image-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build image for scanning
        run: docker build --build-arg VERSION=ci --tag casspeed:ci -f docker/Dockerfile .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: casspeed:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
